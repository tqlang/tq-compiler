out-dir = ".tq-out"
cache-dir = ".tq-cache"

[project]
    name = "myapp"
    target = "dotnet"
    root = "Tqc"

[[module]]
    name = "Tqc"
    path = "./Bootstrap/Tqc"
    dependencies = [
        "module : Tests",
        "module : Tqc.Syntax",
        "module : Std",
    ]

[[module]]
   name = "Tqc.Syntax"
   path = "./Bootstrap/Tqc.Syntax"
   dependencies = [
       "module : Tqc.Syntax",
       "module : Std"
   ]

[[module]]
    name = "Tests"
    path = "./Tests"
    dependencies = [
        "module : Std",
        "module : Dotnet",
    ]

[[module]]
    name = "Std"
    path = "./Lib/Std"
    dependencies = [
        "module : Dotnet",
    ]

[[module]]
    type = "dotnet"
    name = "Dotnet"
    dependencies = [
        "dotnet : System.Runtime : 11.0.0.0",
        "dotnet : System.Console : 11.0.0.0",
        "dotnet : System.Collections : 11.0.0.0",
        "dotnet : System.Threading : 11.0.0.0",
        "dotnet : System.ComponentModel.Primitives : 11.0.0.0",
    ]