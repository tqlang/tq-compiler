out-dir = ".tq-out"
cache-dir = ".tq-cache"

[project]
    name = "silkTest"
    target = "dotnet"
    root = "SilkTest"

[[module]]
    name = "SilkTest"
    path = "./SilkTest"
    dependencies = [
        "module : Std",
        "module : Dotnet",
    ]

[[module]]
    name = "Std"
    path = "./Lib/Std"
    dependencies = [
        "module : Dotnet",
    ]

[[module]]
    type = "dotnet"
    name = "Dotnet"
    dependencies = [
        "dotnet : System.Runtime : 11.0.0.0",
        "dotnet : System.Console : 11.0.0.0",
        "dotnet : System.Collections : 11.0.0.0",
        "dotnet : System.Threading : 11.0.0.0",

        "dotnet : Extern/Silk.NET.Core.dll : 2.22.0.0",
        "dotnet : Extern/Silk.NET.GLFW.dll : 2.22.0.0",
        "dotnet : Extern/Silk.NET.Input.Common.dll : 2.22.0.0",
        "dotnet : Extern/Silk.NET.Input.Extensions.dll : 2.22.0.0",
        "dotnet : Extern/Silk.NET.Input.Glfw.dll : 2.22.0.0",
        "dotnet : Extern/Silk.NET.Maths.dll : 2.22.0.0",
        "dotnet : Extern/Silk.NET.OpenGL.dll : 2.22.0.0",
        "dotnet : Extern/Silk.NET.Windowing.Common.dll : 2.22.0.0",
        "dotnet : Extern/Silk.NET.Windowing.Glfw.dll : 2.22.0.0",
    ]
